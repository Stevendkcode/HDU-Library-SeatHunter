name: Auto Seat Hunter

on:
  #schedule:
    #- cron: '57 11 * * *'  # 北京时间 19:57 取消自动运行
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install requirements
      run: pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install

    # 核心步骤：把 GitHub Secrets 里的账号密码安全地写入 config.yaml
    - name: Inject Secrets into Config
      env:
        LIB_USER: ${{ secrets.USERNAME }}
        LIB_PASS: ${{ secrets.PASSWORD }}
      run: |
        sed -i 's/login_name: ".*"/login_name: "'"$LIB_USER"'"/' config/config.yaml
        sed -i 's/password: ".*"/password: "'"$LIB_PASS"'"/' config/config.yaml

    # 关键修复：强制将云端服务器时区改为北京时间（防止 8 小时时差导致的倒计时错误）
    - name: Set timezone to Beijing Time
      run: sudo timedatectl set-timezone Asia/Shanghai

    - name: Run Seat Hunter Daemon
      run: python main.py --daemon
