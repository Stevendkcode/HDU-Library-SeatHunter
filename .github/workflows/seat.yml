name: Auto Seat Hunter

on:
  schedule:
    # 每天早上 6:50 运行 (UTC 22:50)
    - cron: '00 12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    # 1. 升级使用更新的 checkout
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # 2. 升级使用更新的 setup-python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; endif

    # 4. 运行脚本 (注意：如果你的主文件不是 main.py，请改成你实际的文件名)
    - name: Run Seat Hunter
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        main.py
