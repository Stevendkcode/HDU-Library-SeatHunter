name: Auto Seat Hunter

on:
  # 定时触发：这里设置的是每天早上 6点50分 自动运行（UTC时间比北京时间慢8小时，所以写 22:50 UTC）
  # 你可以根据需要修改这里的小时和分钟
  schedule:
    - cron: '00 12 * * *'
  
  # 允许你自己手动在网页上点按钮测试运行
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    # 1. 把你的代码下载到云端服务器
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 安装 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; endif

    # 4. 运行抢座脚本，并把你在 Secrets 里存的账号密码安全地传进去
    - name: Run Seat Hunter
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        main.py
