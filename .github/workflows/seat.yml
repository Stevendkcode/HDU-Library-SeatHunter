name: Auto Seat Hunter

on:
  schedule:
    # 每天晚上 20:00 运行 (UTC 12:00)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install requirements
      run: pip install -r requirements.txt

    # 关键：下载 Playwright 浏览器驱动，解决 Executable doesn't exist 报错
    - name: Install Playwright browsers
      run: playwright install

    # 运行主程序：依次传入 学号、密码，如果失败询问是否重试时输入 n 退出
    - name: Run Seat Hunter
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        printf "%s\n%s\nn\n" "$USERNAME" "$PASSWORD" | python main.py
