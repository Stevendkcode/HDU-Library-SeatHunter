name: Auto Seat Hunter

on:
  schedule:
    # 每天晚上 20:00 运行 (UTC 12:00)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install requirements
      run: pip install -r requirements.txt

    # 核心修改：利用管道命令自动把 Secrets 里的账号和密码依次输入进去
    - name: Run Seat Hunter
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        printf "%s\n%s\n" "$USERNAME" "$PASSWORD" | python main.py
