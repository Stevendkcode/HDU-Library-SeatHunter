name: Auto Seat Hunter

on:
  schedule:
    - cron: '58 11 * * *'  # 每天 UTC 12:00（北京时间 20:00）自动触发
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install requirements
      run: pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install

    # 核心步骤：把 GitHub Secrets 里的账号密码安全地写入 config.yaml
    - name: Inject Secrets into Config
      env:
        LIB_USER: ${{ secrets.USERNAME }}
        LIB_PASS: ${{ secrets.PASSWORD }}
      run: |
        sed -i 's/login_name: ".*"/login_name: "'"$LIB_USER"'"/' config/config.yaml
        sed -i 's/password: ".*"/password: "'"$LIB_PASS"'"/' config/config.yaml

    - name: Run Seat Hunter Daemon
      run: python main.py --daemon
