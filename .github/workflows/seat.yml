name: Auto Seat Hunter

on:
  schedule:
    # 每天早上 6:50 运行 (UTC 22:50)
    - cron: '00 12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 把安装命令拆开，避免多行语法报错
    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install requirements
      run: pip install -r requirements.txt

    # 运行主程序（如果你的文件名不是 main.py，请在这里修改）
    - name: Run Seat Hunter
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: python main.py
